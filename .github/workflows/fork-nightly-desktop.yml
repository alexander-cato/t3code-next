name: Fork nightly desktop

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the signed and verified macOS update
        type: boolean
        default: false
      force:
        description: Build a new version of an already released source
        type: boolean
        default: false
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fork-nightly-desktop
  cancel-in-progress: false

jobs:
  resolve:
    if: >-
      github.repository == 'alexander-cato/t3code-next' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (vars.FORK_RELEASE_ENABLED == 'true' && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      ref: ${{ steps.plan.outputs.ref }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      previous_ref: ${{ steps.plan.outputs.previous_ref }}
      publish: ${{ github.event_name == 'workflow_run' || inputs.publish }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Pin verified main and choose the next cross-repository version
        id: plan
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          FORCE_BUILD: ${{ inputs.force }}
        with:
          script: |
            const { resolveRelease } = require('./.github/scripts/fork-release-plan.cjs');
            const plan = await resolveRelease({ github, context, force: process.env.FORCE_BUILD === 'true' });
            for (const [key, value] of Object.entries(plan)) core.setOutput(key === 'previousRef' ? 'previous_ref' : key, value ?? '');
            if (plan.reason) core.info(plan.reason);

  macos:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: macos-26
    environment: fork-release
    timeout-minutes: 60
    env:
      T3CODE_DESKTOP_FORK: "true"
      T3CODE_TELEMETRY_CHANNEL: dev
      VERSION: ${{ needs.resolve.outputs.version }}
      SOURCE_SHA: ${{ needs.resolve.outputs.ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - name: Verify checkout and signing availability
        env:
          SIGNING_CONFIGURED: ${{ secrets.CSC_LINK != '' && secrets.CSC_KEY_PASSWORD != '' && secrets.APPLE_API_KEY != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' && secrets.MACOS_PROVISIONING_PROFILE != '' && vars.APPLE_TEAM_ID == '5Y33T3HS8S' }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(uname -m)" = arm64
          if [[ "$SIGNING_CONFIGURED" != true ]]; then
            echo 'Protected fork-release signing credentials and the existing Apple team are required.' >&2
            exit 1
          fi
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - name: Configure the fork build
        run: |
          set -euo pipefail
          node scripts/update-release-package-versions.ts "$VERSION"
          cp .env.example .env
          node <<'NODE'
          const fs = require('node:fs');
          const config = fs.readFileSync('.env.example', 'utf8');
          for (const name of ['T3CODE_CLERK_PUBLISHABLE_KEY', 'T3CODE_CLERK_JWT_TEMPLATE', 'T3CODE_CLERK_CLI_OAUTH_CLIENT_ID', 'T3CODE_RELAY_URL']) {
            const value = config.split('\n').find((line) => line.startsWith(`${name}=`))?.slice(name.length + 1).trim();
            if (!value || !/^[A-Za-z0-9._:/-]+$/.test(value)) throw new Error(`Missing or malformed ${name}.`);
            fs.appendFileSync(process.env.GITHUB_ENV, `${name}=${value}\n`);
          }
          NODE
      - name: Build desktop bundle
        run: vp run build:desktop
      - name: Sign, notarize, staple, and validate the macOS payload
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
          T3CODE_CLERK_PASSKEY_RP_DOMAINS: ${{ vars.CLERK_PASSKEY_RP_DOMAINS }}
        run: |
          set -euo pipefail
          umask 077
          key_path="$RUNNER_TEMP/fork-notarization-key.p8"
          profile_path="$RUNNER_TEMP/fork.provisionprofile"
          trap 'rm -f "$key_path" "$profile_path"' EXIT
          printf '%s' "$APPLE_API_KEY" > "$key_path"
          export APPLE_API_KEY="$key_path"
          printf '%s' "$MACOS_PROVISIONING_PROFILE" | base64 -D > "$profile_path"
          security cms -D -i "$profile_path" >/dev/null
          export T3CODE_APPLE_TEAM_ID="$APPLE_TEAM_ID"
          export T3CODE_MACOS_PROVISIONING_PROFILE="$profile_path"
          vp run dist:desktop:artifact --platform mac --target dmg --arch arm64 --build-version "$VERSION" --skip-build --signed
      - name: Verify the updater hashes and collect only release assets
        run: |
          set -euo pipefail
          node .github/scripts/verify-fork-artifacts.cjs release "$VERSION" "$SOURCE_SHA" > "$RUNNER_TEMP/fork-assets.txt"
          mkdir release-publish
          while IFS= read -r asset; do cp "release/$asset" release-publish/; done < "$RUNNER_TEMP/fork-assets.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fork-desktop-mac-arm64
          path: release-publish/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [resolve, macos]
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment: fork-release
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.resolve.outputs.version }}
      SOURCE_SHA: ${{ needs.resolve.outputs.ref }}
      TAG: ${{ needs.resolve.outputs.tag }}
      PREVIOUS_REF: ${{ needs.resolve.outputs.previous_ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: fork-desktop-mac-arm64
          path: assets
      - name: Recheck artifacts before publishing
        run: |
          set -euo pipefail
          (cd assets && sha256sum --check SHA256SUMS.txt)
          node .github/scripts/verify-fork-artifacts.cjs assets "$VERSION" "$SOURCE_SHA" > "$RUNNER_TEMP/fork-assets.txt"
      - name: Write our changes and upstream changes
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('node:fs');
            const { generateForkReleaseNotes } = require('./.github/scripts/fork-release-notes.cjs');
            const notes = await generateForkReleaseNotes({ github, repository: context.repo,
              ref: process.env.SOURCE_SHA, previousRef: process.env.PREVIOUS_REF || undefined });
            if (!notes.trim()) throw new Error('Release notes are empty.');
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/notes.md`, notes);
      - name: Publish the verified update
        run: |
          set -euo pipefail
          assets=()
          while IFS= read -r asset; do assets+=("assets/$asset"); done < "$RUNNER_TEMP/fork-assets.txt"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --draft --prerelease --title "T3 Code Fork $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
