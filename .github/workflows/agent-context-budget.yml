name: Agent Context Budget

# Fails when a PR raises a value in agentContextBudget.json above its base. AgentContextBudget.test.ts
# keeps that file equal to the measured context, so the context cannot grow by editing the file.
# To accept growth on purpose, a maintainer adds the agent-context-increase label.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact nightly candidate commit to check
        type: string
        required: true
      base_sha:
        description: Exact main commit the nightly PR is based on
        type: string
        required: true
      pull_request:
        description: Nightly sync PR number
        type: string
        required: true
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: agent-context-budget-${{ github.event.pull_request.number || inputs.pull_request }}
  cancel-in-progress: true

jobs:
  budget:
    name: Agent context budget
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BUDGET: apps/server/src/provider/agentContextBudget.json
      BASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event.pull_request.base.sha }}
      ALLOW_INCREASE: ${{ contains(github.event.pull_request.labels.*.name, 'agent-context-increase') }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: |
            /apps/server/src/provider/agentContextBudget.json
            /.github/scripts/validate-nightly-dispatch.cjs
          sparse-checkout-cone-mode: false

      - name: Validate explicit nightly CI dispatch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          PULL_NUMBER: ${{ inputs.pull_request }}
        with:
          script: |
            const { validateNightlyDispatch } = require('./.github/scripts/validate-nightly-dispatch.cjs');
            const result = await validateNightlyDispatch({ github, context,
              expectedSha: process.env.EXPECTED_SHA, baseSha: process.env.BASE_SHA,
              pullNumber: process.env.PULL_NUMBER });
            core.exportVariable('ALLOW_INCREASE', String(result.allowIncrease));

      - name: Compare with PR base
        run: |
          git fetch --quiet --depth=1 origin "$BASE_SHA"
          if ! git cat-file -e "FETCH_HEAD:$BUDGET" 2>/dev/null; then
            echo "The PR base has no agent context budget yet."
            exit 0
          fi
          git show "FETCH_HEAD:$BUDGET" > "$RUNNER_TEMP/base.json"
          grown=$(jq -r --slurpfile base "$RUNNER_TEMP/base.json" '
            to_entries[]
            | select($base[0][.key] != null and .value > $base[0][.key])
            | "\(.key): \($base[0][.key]) -> \(.value) (+\(.value - $base[0][.key]))"
          ' "$BUDGET")
          if [ -z "$grown" ]; then
            echo "Agent context is not larger than the PR base."
            exit 0
          fi
          printf 'Agent context grew compared to the PR base:\n%s\n' "$grown"
          if [ "$ALLOW_INCREASE" = "true" ]; then
            echo "Accepted by the agent-context-increase label."
            exit 0
          fi
          echo "::error file=$BUDGET::Agent context grew compared to the PR base. Cut the added text and rerun the evals that cover it (evals/README.md), or ask a maintainer to add the agent-context-increase label."
          exit 1
